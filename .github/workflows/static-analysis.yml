name: Static analysis

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Pint · PHPStan · Rector
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Authenticate composer's GitHub API access so VCS resolution of sibling
      # laranail packages isn't rate-limited (HTTP 429) on unauthenticated runners.
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sodium
          coverage: none
      # Override every committed `path` repo with its public GitHub source.
      # `no-api: true` git-clones instead of using the GitHub REST API (avoids 429).
      - name: Resolve laranail packages from VCS
        run: |
          for pkg in package-tools console license-verifier db-tools; do
            composer config "repositories.$pkg" "{\"type\":\"vcs\",\"url\":\"https://github.com/laranail/$pkg\",\"no-api\":true}"
          done
      - name: Install dependencies
        run: composer update --prefer-stable --no-interaction --no-progress
      - name: Pint
        run: vendor/bin/laranail-pint --test
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github
      - name: Rector
        run: vendor/bin/rector process --dry-run --no-progress-bar
